services:
  postgres:
    image: postgres:16-alpine
    container_name: devkics-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-devkics}
      POSTGRES_USER: ${POSTGRES_USER:-devkics}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devkics}
    ports:
      - "5432:5432"
    volumes:
      - devkics_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-devkics} -d ${POSTGRES_DB:-devkics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      target: runtime
    container_name: devkics-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 8080
      DATABASE_URL: postgresql://${POSTGRES_USER:-devkics}:${POSTGRES_PASSWORD:-devkics}@postgres:5432/${POSTGRES_DB:-devkics}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change-me-access-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-secret}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-7d}
      PORT: 8080
    ports:
      - "8080:8080"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:8080/index.html').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  devkics_postgres_data:
